    function RefleshMap(store) {
        $("#search_map").show();
        $("div[title=storeinfo]").show();
        mSelectedID = store.mID;
        mShowSelectedInfo = true;
        //jako add 20171124 start
        var oldY = store.mY.toString();
        var oldX = store.mX.toString();
        Selecty = oldY.slice(0, 2) + "." + oldY.slice(2, oldY.length);
        Selectx = oldX.slice(0, 3) + "." + oldX.slice(3, oldX.length);
        //避免重新查詢發生地圖已初始化問題
        if (document.getElementById("m_map") != null) {
            document.getElementById("search_map").removeChild(document.getElementById("m_map"));
        }

        var map = document.createElement("div");
        map.id = "m_map";
        map.style = "width: 100%; height: 100%;";
        document.getElementById("search_map").appendChild(map);
        
        initmap("m_map", "https://emap.pcsc.com.tw/npk/npkget.ashx", Selecty, Selectx, 17, NewMapcallback);
        //cleanmark();

        mapview(Selecty, Selectx, 17);

        control(true);
        smallmap("close", true, 4); //預設啟用小地圖，但不打開小地圖(close)
        
		//隱藏勤威 關於 
		//$("#sabout").hide();
        //var kwmapabout = document.getElementsByTagName("div")[106].innerHTML;
        //document.getElementsByTagName("div")[106].innerHTML = kwmapabout.replace("關於", "");
        //jako add 20171124 end

        RefleshStore(store.mID);
    }

    function NewMapcallback(m) {
        if (m.mode == "click") {
            //console.log(m);
            //取得目前點位
            Selecty = m.lat.toString().substring(0, 9);
            Selectx = m.lng.toString().substring(0, 10);
            mapview(Selecty, Selectx, 17);
            RefleshStore(m.id);
        }
        else if (m.mode == "view") {
            //console.log(m);
            var getlng_x1 = m.lng1.toString().substring(0,10);
            var getlng_x2 = m.lng2.toString().substring(0,10);
            var getlat_y1 = m.lat1.toString().substring(0,9);
            var getlat_y2 = m.lat2.toString().substring(0,9);
            var getlng_newx1 = getlng_x1.replace(".", "");
            var getlng_newx2 = getlng_x2.replace(".", "");
            var getlat_newy1 = getlat_y1.replace(".", "");
            var getlat_newy2 = getlat_y2.replace(".", "");
            
            // 多數打點 start
            if (m.z > 14) {//地圖縮放等級小於 14 不顯示打點圖示
                $.post(
                    'EMapSDK.aspx',
                    {
                        commandid: 'Search0007',
                        x1: getlng_newx1,
                        y1: getlat_newy1,
                        x2: getlng_newx2,
                        y2: getlat_newy2
                    },
                    function (pXml) {
                        //console.log(pXml);//顯示點位xml資料
                        cleanmark(); //清除之前打點，重新打點
                        var xCount = pXml.getElementsByTagName("X"); //取得範圍內門市筆數
                        for (i = 0; i < xCount.length; i++) {
                            DisplayStoreName = pXml.getElementsByTagName("POIName")[i].childNodes[0].nodeValue;// 取得店名 
                            DisplayStoreID = pXml.getElementsByTagName("POIID")[i].childNodes[0].nodeValue; // 取得店號
                            var DisplayStoreX = pXml.getElementsByTagName("X")[i].childNodes[0].nodeValue;// 取得 x 座標
                            var DisplayStoreY = pXml.getElementsByTagName("Y")[i].childNodes[0].nodeValue;// 取得 y 座標
                            if (m.z > 14) {//地圖縮放等級小於 14 不顯示打點圖示
                                if (DisplayStoreY == padRight(Selecty, 9) && DisplayStoreX == padRight(Selectx, 10)) { //顯示選擇門市
                                    addmark(Selecty, Selectx, SelectStoreIMG, 36, 36, 36, "", DisplayStoreID, false, true, DisplayStoreName);
                                }
                                else { //其餘非選擇門市
                                    addmark(DisplayStoreY, DisplayStoreX, OtherMapStoreIMG, 36, 36, 36, "", DisplayStoreID, false, true, DisplayStoreName);
                                }
                            }
                            else {
                                cleanmark();//地圖縮放等級小於 14 不顯示打點圖示
                            }
                        }
                    }
                );
            } else {
                cleanmark();//地圖縮放等級小於 14 不顯示打點圖示
            }
            // 多數打點 end
        }
    }

    function padLeft(str, lenght) {
        if (str.length >= lenght)
            return str;
        else
            return padLeft("0" + str, lenght);
    }
    function padRight(str, lenght) {
        if (str.length >= lenght)
            return str;
        else
            return padRight(str + "0", lenght);
    }

                    storeInfo = storeInfo + "<tr><td align=\"center\" class=\"alt\">" + _store.mPoi[0].mName;
                    if (_store.mPoi[0].mSpecialStore_Kind != null) {
                        storeInfo = storeInfo + "<div id=\"icon_special\">" + _store.mPoi[0].mSpecialStore_Kind + "</div>";
                    }
                    storeInfo = storeInfo + "</td>";
                    var faxno = '';
                    if (_store.mPoi[0].mFax != null) {
                        faxno = _store.mPoi[0].mFax;
                    }
                    storeInfo = storeInfo + "<td valign=\"top\" class=\"alt\"><table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" class=\"mytb_1\"><tr><td width=\"315\">門市店號：" + _store.mPoi[0].mID + "<br />門市店名：" + _store.mPoi[0].mName + "<br />地址：" + _store.mPoi[0].mAddress + "<br />電話：" + _store.mPoi[0].mTel + "<br />接收傳真服務(付費)：" + faxno + "</td></tr></table></td>";
                    storeInfo = storeInfo + "<td valign=\"top\" class=\"alt\"><table border=\"0\" cellspacing=\"0\" cellpadding=\"0\" class=\"icon_sps_li\">";
                    storeInfo = storeInfo + "<tr></tr><tr>";
                   
                    if (_store.mPoi[0].mStoreImageTitle != null) {
                        //storeInfo = storeInfo + "<td><input type='text' value='" + _store.mPoi[0].mStoreImageTitle + "'/></td>";
                        var storeImage = _store.mPoi[0].mStoreImageTitle.split(',');

                        storeImage.forEach(function (element, index) {
                            var sImage = element.substring(0, 2);
                            var sTitle = element.substring(2, element.length + 2);
                            //                            storeList = storeList + "<td><input type='text' value='" +  + "'/></td>";
                            storeInfo = storeInfo + "<td class=\"icon_sps_li\"><img class='serviceImg' src=\"menuImg/service_" + sImage + ".jpg\" width=\"26\" height=\"26\"  onerror=\"this.src='images/iconWhite.png'\" title=\"" + sTitle + "\"/></td>";
                            if (index % 7 == 6) { storeInfo = storeInfo + "</tr><tr>"; }
                        });
                    }


                    storeInfo = storeInfo + "</tr></table>";
                    if (_store.mPoi[0].mStore_URL != null) {
                        storeInfo = storeInfo + "<a href=\"" + _store.mPoi[0].mStore_URL + "\" target=_blank class=\"special_but\">Dr.7介紹特色門市</a>";
                    }

                    storeInfo = storeInfo + "</td></tr>";

<script type="text/javascript">
    var today = 2025+(6<=9?'0':'')+6+(26<=9?'0':'')+26;
    var yesterday = 2025+(6<=9?'0':'')+6+(25<=9?'0':'')+25
    $.get("emap_service_" + today + ".html", function (data) {
    }).done(function (data, textStatus, jqXHR) {
        $('#menu_li').html(data);
        $(document).ready(function () {
            $('[id^=checkbox_]').change(function () {
                var str = "";
                var strName = "";
                $('input:checked').each(function () {
                    var checkedItem = this.id.substring(this.id.length - 2, this.id.length);
                    //str = str + "'" + checkedItem + "',";
                    str = str + checkedItem + ",";
                    strName = strName + $('#div_service_' + checkedItem).text().trim() + "、";
                });
                str = str.substr(0, str.length - 1);
                strName = strName.substr(0, strName.length - 1);
                $('#leftMenuChecked').val(str);
                $('#leftMenuCheckedName').val(strName);
            });
        });
    }).fail(function (jqXHR, textStatus, errorThrown) {
        $.get("emap_service_" + yesterday + ".html", function (data) {
            $('#menu_li').html(data);
            $(document).ready(function () {
                $('[id^=checkbox_]').change(function () {
                    var str = "";
                    var strName = "";
                    $('input:checked').each(function () {
                        //console.log($('\'#'+this.id+'\'').parent().next().next().text().trim());
                        var checkedItem = this.id.substring(this.id.length - 2, this.id.length);
                        //str = str + "'" + checkedItem + "',";
                        str = str + checkedItem + ",";
                        strName = strName + $('#div_service_' + checkedItem).text().trim() + "、";
                        //strName = strName + this.parent().next().next().text().trim() + "、";
                        //strName = strName + $('\'#'+this.id+'\'').parent().next().next().text().trim() + "、";
                    });
                    str = str.substr(0, str.length - 1);
                    strName = strName.substr(0, strName.length - 1);
                    $('#leftMenuChecked').val(str);
                    $('#leftMenuCheckedName').val(strName);
                });
            });
        });
    });
    
    $(document).ready(function () {
        try {
            $("body select").msDropDown();
        } catch (e) {
            alert(e.message);
        }
        eMap.init();

        if (_largs.length > 0 && _largs['storeid']) {
            Selected_Query_Type = "StoreID";
            Selected_Store_ID = _largs['storeid'];
        }
        $('input[name=shop_na]').click(function () {
            $('input[name=shop_na]').val("");
        });
        $('input[name=shop_no]').click(function () {
            $('input[name=shop_no]').val("");
        });
        $('input[name=address]').click(function () {
            $('input[name=address]').val("");
        });
        CleanItem();
        RefleshUI();
        $("#link_reset").bind("click", function () {
            $('#leftMenuChecked').val('');
            $('#leftMenuCheckedName').val('');
            ResetCondition();
            $('input[name=shop_na]').val("請輸入店名");
            $('input[name=shop_no]').val("請輸入店號");
            $('input[name=address]').val("請輸入街道名");
            RefleshUI();
            $("#maptable").hide();
            //修正在按回地圖首頁時，可重新查詢點位出來 jako add 20171222 start
            if (document.getElementById("m_map") != null) {
                document.getElementById("search_map").removeChild(document.getElementById("m_map"));
            }

            var map = document.createElement("div");
            map.id = "m_map";
            map.style = "width: 100%; height: 100%;";
            document.getElementById("search_map").appendChild(map);
            initmap("m_map", "https://emap.pcsc.com.tw/npk/npkget.ashx", 25, 121.5, 17, NewMapcallback);
            mapview(25, 121.5, 15);
            //jako add 20171222 end
        });
        $("a[id^=maplink_]").bind("click", function () {
            ResetCondition();
            Selected_Query_Type = "Area";
            Selected_Area = $(this).html();
            RefleshUI();
        });
        $("#Image_store_name").bind("click", function () {
            if ($.trim($('input[name=shop_na]').val()).length == 0 || $('input[name=shop_na]').val() == '請輸入店名') {
                alert("請輸入店名");
            }
            else {
                ResetCondition();
                Selected_Query_Type = "StoreName";
                Selected_Store_Name = $("input[name=shop_na]").val().replace("門市", "");
                RefleshUI();
            }
        });
        $("#Image_address").bind("click", function () {
            if ($.trim($('input[name=address]').val()).length == 0 || $('input[name=address]').val() == '請輸入街道名') {
                alert("請輸入街道名");
            }
            else {
                ResetCondition();
                Selected_Query_Type = "Address";
                Selected_Address = $("input[name=address]").val();
                RefleshUI();
            }
        });
        $("#link_type").bind("click", function () {
            ResetCondition();
            Selected_Query_Type = "Type";
            RefleshUI();
        });
        $("#Image_store_id").bind("click", function () {
            var regExp = /^[\d]+$/;
            if (!regExp.test($('input[name=shop_no]').val())) {
                alert("請輸入數字");
            }
            else if ($('input[name=shop_no]').val().length != 6) {
                alert("請輸入六碼店號");
            }

            else {
                ResetCondition();
                Selected_Query_Type = "StoreID";
                Selected_Store_ID = $("input[name=shop_no]").val();
                RefleshUI();
            }
        });
        $("#d_list").bind("change", function () {
            ResetCondition();
            Selected_Query_Type = "SpecialStore";
            Selected_Store_Type = $("#d_list").find(":selected").text();
            RefleshUI();
        });
        $(document).ajaxStart($.blockUI(({ message: '<h3><img src=\"images/busy.gif\" /> 處理中...</h3>', css: { color: '#626262' } }))).ajaxStop($.unblockUI());
    });
</script>
